# Fast blueprint workflow — every push to master, ~3-5 min.
# Builds the Lean project + blueprint web output; deploys to Pages.
# Skips the slow Mathlib API doc-gen (that's docs.yml, on tags only).
# Uses `leanprover-community/docgen-action` for the same docker-based
# plasTeX pipeline as PFR / FLT / sphere-eversion (a hand-rolled
# pip+plastex step on bare Ubuntu does NOT correctly resolve
# `\input{subdir/file}` — see docs/CI.md troubleshooting).

name: Blueprint (fast — every push)

on:
  push:
    branches:
      - master
  workflow_dispatch:        # allow manual runs from the Actions tab

# Cancel previous fast runs if a new commit lands.
# The slow workflow uses a separate concurrency group so they don't fight.
concurrency:
  group: pages-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build Lean + blueprint + deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build Lean + blueprint (no API docs, no Jekyll)
        id: deployment
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          api-docs: false   # skip ~15-min Mathlib doc-gen; tag a release for docs
          build-page: false # our `docs/` is internal markdown, not a Jekyll source
