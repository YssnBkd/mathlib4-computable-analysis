name = "ComputableAnalysis"
defaultTargets = ["ComputableAnalysis"]

# Mathlib4 — tracked at master until we cut a release.
# Pin to a specific commit via `rev = "..."` once L0 builds reliably.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"


[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"
[[lean_lib]]
name = "ComputableAnalysis"

# Project-wide Lean options — match Mathlib4 style.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true
