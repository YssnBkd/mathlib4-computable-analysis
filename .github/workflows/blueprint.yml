# Fast blueprint workflow — every push to master, ~3-5 min.
# Builds the Lean project and the blueprint web output; deploys to Pages.
# Does NOT build Mathlib API docs (that's docs.yml, on tags only).
# See docs/CI.md for the full rationale.

name: Blueprint (fast — every push)

on:
  push:
    branches:
      - master
  workflow_dispatch:        # allow manual runs from the Actions tab

# Cancel previous fast runs if a new commit lands.
# The slow workflow uses a separate concurrency group so they don't fight.
concurrency:
  group: pages-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build blueprint + deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build Lean project (lake build only — no lint, no mk_all-check, no docs)
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: false
          use-mathlib-cache: auto

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages required by leanblueprint
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config

      - name: Install leanblueprint
        run: pip install leanblueprint

      - name: Debug — dump blueprint/src/ contents (delete after CI green)
        run: |
          echo "=== PWD ===" && pwd
          echo "=== blueprint/src/ ===" && ls -la blueprint/src/
          echo "=== blueprint/src/macros/ ===" && ls -la blueprint/src/macros/ 2>&1 || echo "MACROS DIR MISSING"
          echo "=== head common.tex ===" && head -5 blueprint/src/macros/common.tex 2>&1 || echo "NOT FOUND"
          echo "=== head web.tex ===" && head -5 blueprint/src/web.tex 2>&1 || echo "NOT FOUND"
          echo "=== plastex.cfg ===" && cat blueprint/src/plastex.cfg 2>&1 || echo "NOT FOUND"

      - name: Build blueprint HTML (plasTeX → blueprint/web/)
        run: leanblueprint web

      - name: Validate every \lean{...} resolves
        run: leanblueprint checkdecls

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload blueprint as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
